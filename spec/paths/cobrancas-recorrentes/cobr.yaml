    post:
      tags:
        - "CobR"
      summary: "Criar cobrança recorrente."
      security:
        - OAuth2: [cobr.write]
      description: |-
        Endpoint para criar uma cobrança recorrente, neste caso, o txid deve ser definido pelo PSP.
      requestBody:
        $ref: "../../components/requestBodies/cobrancas-recorrentes/CobRBody.yaml"
      responses:
        "201":
          description: "Cobrança recorrente criada."
          content:
            "application/json":
              schema:
                $ref: "../../components/schemas/cobrancas-recorrentes/CobRGerada.yaml"
              examples:
                response1:
                  $ref: "../../components/examples/cobrancas-recorrentes/cobRResponse1.yaml"
        "400":
          description: "Requisição com formato inválido."
          content:
            application/problem+json:
              schema:
                $ref: "../../components/schemas/erros/Problema.yaml"
              examples:
                requisicao1:
                  $ref: "../../components/examples/erros/OperacaoInvalidaCobRExample1.yaml"
        "403":
          $ref: "../../components/responses/AcessoNegado.yaml"
        "503":
          $ref: "../../components/responses/ServicoIndisponivel.yaml"
    get:
      parameters:
        - in: "query"
          name: "inicio"
          required: true
          schema:
            $ref: "../../components/schemas/comuns/Inicio.yaml"
        - in: "query"
          name: "fim"
          required: true
          schema:
            $ref: "../../components/schemas/comuns/Fim.yaml"
        - name: "idRec"
          in: "query"
          schema:
            type: "string"
            title: "ID Recorrência"
            pattern: "[a-zA-Z0-9]{29}"
            minLength: 29
            maxLength: 29
            description: "Filtro pelo Identificador da Recorrência."
        - name: "cpf"
          in: "query"
          schema:
            type: "string"
            title: "CPF"
            pattern: "/^\\d{11}$/"
            description: "Filtro pelo CPF do devedor. Não pode ser utilizado ao mesmo tempo que o CNPJ."
        - name: "cnpj"
          in: "query"
          schema:
            type: "string"
            title: "CNPJ"
            pattern: "^[0-9A-Z]{14}$"
            description: "Filtro pelo CNPJ do devedor. Não pode ser utilizado ao mesmo tempo que o CPF."
        - name: "status"
          in: "query"
          schema:
            type: "string"
            title: "Status do registro da cobrança recorrente."
            description: "Filtro pelo status da cobrança recorrente."
        - name: "convenio"
          in: "query"
          schema:
            type: "string"
            title: "Convênio"
            maxLength: 60
            description: "Filtro pelo convênio associado."
        - $ref: "../../components/parameters/paginaAtual.yaml"
        - $ref: "../../components/parameters/itensPorPagina.yaml"
      tags:
        - "CobR"
      summary: "Consultar lista de cobranças recorrentes."
      security:
        - OAuth2: [cobr.read]
      description: |-
        Endpoint para consultar cobranças recorrentes através de parâmetros como início, fim, idRec, cpf, cnpj, status e convênio.
      responses:
        "200":
          description: "Lista de cobranças recorrentes."
          content:
            "application/json":
              schema:
                $ref: "../../components/schemas/cobrancas-recorrentes/CobsRConsultadas.yaml"
              examples:
                retorno1:
                  $ref: "../../components/examples/cobrancas-recorrentes/getCobR1.yaml"
        "403":
          $ref: "../../components/responses/AcessoNegado.yaml"
        "503":
          $ref: "../../components/responses/ServicoIndisponivel.yaml"
