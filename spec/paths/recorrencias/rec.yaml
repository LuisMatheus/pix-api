    get:
      parameters:
        - in: "query"
          name: "inicio"
          required: true
          schema:
            $ref: "../../components/schemas/comuns/Inicio.yaml"
        - in: "query"
          name: "fim"
          required: true
          schema:
            $ref: "../../components/schemas/comuns/Fim.yaml"
        - name: "cpf"
          in: "query"
          schema:
            type: "string"
            title: "CPF"
            pattern: "/^\\d{11}$/"
            description: "Filtro pelo CPF do devedor. Não pode ser utilizado ao mesmo tempo que o CNPJ."
        - name: "cnpj"
          in: "query"
          schema:
            type: "string"
            title: "CNPJ"
            pattern: "^[0-9A-Z]{14}$"
            description: "Filtro pelo CNPJ do devedor. Não pode ser utilizado ao mesmo tempo que o CPF."
        - name: "locationPresente"
          in: "query"
          schema:
            type: "boolean"
        - name: "status"
          in: "query"
          schema:
            type: "string"
            title: "Status do registro da recorrência"
            description: "Filtro pelo status da recorrência."
        - name: "convenio"
          in: "query"
          schema:
            type: "string"
            title: "Convênio"
            maxLength: 60
            description: "Filtro pelo convênio associado."
        - $ref: "../../components/parameters/paginaAtual.yaml"
        - $ref: "../../components/parameters/itensPorPagina.yaml"
      tags:
        - "Rec"
      summary: "Consultar lista de recorrências."
      security:
        - OAuth2: [rec.read]
      description: "Consultar lista de recorrências."
      responses:
        "200":
          description: "OK"
          content:
            "application/json":
              schema:
                $ref: "../../components/schemas/recorrencias/RecsConsultadas.yaml"
              examples:
                retorno1:
                  $ref: "../../components/examples/recorrencias/getRec1.yaml"
        "403":
          $ref: "../../components/responses/AcessoNegado.yaml"
        "503":
          $ref: "../../components/responses/ServicoIndisponivel.yaml"
    post:
      tags:
        - "Rec"
      summary: "Criar recorrência."
      security:
        - OAuth2: [rec.write]
      description: "Criar recorrência"
      requestBody:
        $ref: "../../components/requestBodies/recorrencias/RecBody.yaml"
      responses:
        "201":
          description: "Recorrência criada"
          content:
            "application/json":
              schema:
                $ref: "../../components/schemas/recorrencias/RecGerada.yaml"
              examples:
                retorno1:
                  $ref: "../../components/examples/recorrencias/recResponse1.yaml"
                retorno2:
                  $ref: "../../components/examples/recorrencias/recResponse2.yaml"
        "400":
          description: "Requisição com formato inválido."
          content:
            application/problem+json:
              schema:
                $ref: "../../components/schemas/erros/Problema.yaml"
              examples:
                requisicao1:
                  $ref: "../../components/examples/erros/OperacaoInvalidaRecExample1.yaml"
        "403":
          $ref: "../../components/responses/AcessoNegado.yaml"
        "503":
          $ref: "../../components/responses/ServicoIndisponivel.yaml"
