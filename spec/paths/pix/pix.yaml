    get:
      parameters:
        - in: "query"
          name: "inicio"
          required: true
          schema:
            $ref: "../../components/schemas/comuns/Inicio.yaml"
        - in: "query"
          name: "fim"
          required: true
          schema:
            $ref: "../../components/schemas/comuns/Fim.yaml"
        - name: "txid"
          in: "query"
          schema:
            allOf:
              - $ref: "../../components/schemas/comuns/TxId.yaml"
              - pattern: "[a-zA-Z0-9]{1,35}"
        - name: "txIdPresente"
          in: "query"
          schema:
            type: "boolean"
        - name: "devolucaoPresente"
          in: "query"
          schema:
            type: "boolean"
        - name: "finalidadeMED"
          in: "query"
          schema:
            type: "boolean"
        - name: "cpf"
          in: "query"
          schema:
            type: "string"
            title: "CPF"
            pattern: "/^\\d{11}$/"
            description: "Filtro pelo CPF do pagador. Não pode ser utilizado ao mesmo tempo que o CNPJ."
        - name: "cnpj"
          in: "query"
          schema:
            type: "string"
            title: "CNPJ"
            pattern: "^[0-9A-Z]{14}$"
            description: "Filtro pelo CNPJ do pagador. Não pode ser utilizado ao mesmo tempo que o CPF."
        - $ref: "../../components/parameters/paginaAtual.yaml"
        - $ref: "../../components/parameters/itensPorPagina.yaml"
      tags:
        - "Pix"
      summary: "Consultar Pix recebidos."
      security:
        - OAuth2: [pix.read]
      description: "Endpoint para consultar Pix recebidos"
      responses:
        "200":
          description: "lista dos Pix recebidos de acordo com o critério de busca."
          content:
            "application/json":
              schema:
                $ref: "../../components/schemas/pix/PixConsultados.yaml"
              examples:
                getCobs1:
                  $ref: "../../components/examples/pix/getPix1.yaml"
        "403":
          $ref: "../../components/responses/AcessoNegado.yaml"
        "503":
          $ref: "../../components/responses/ServicoIndisponivel.yaml"
