    put:
      tags:
        - WebhookRec
      summary: Configurar Webhook.
      description: |
        Endpoint para configuração do serviço de notificações acerca de recorrências. Somente recorrências associadas ao usuário recebedor serão notificadas.
      security:
        - OAuth2: [webhookrec.write]
      requestBody:
        $ref: "../requestBodies/WebhookRecConfigBody.yaml"
      responses:
        "200":
          description: Webhook para notificações.
        "400":
          description: "Requisição com formato inválido."
          content:
            application/problem+json:
              schema:
                $ref: "../../03 - Tratamento de erros/schemas/Problema.yaml"
              examples:
                exemplo1:
                  $ref: "../../03 - Tratamento de erros/examples/RequisicaoInvalidaWebhookExample1.yaml"
        "403":
          $ref: "../../03 - Tratamento de erros/responses/AcessoNegado.yaml"
        "404":
          $ref: "../../03 - Tratamento de erros/responses/NaoEncontrado.yaml"
        "503":
          $ref: "../../03 - Tratamento de erros/responses/ServicoIndisponivel.yaml"
      callbacks:
        rec:
          "{$request.body#/webhookUrl}/rec":
            post:
              description: ""
              security: []
              requestBody:
                $ref: "../requestBodies/WebhookRecBody.yaml"
              responses:
                "200":
                  description: "Notificação recebida com sucesso"
    get:
      tags:
        - WebhookRec
      summary: "Exibir informações acerca do Webhook."
      description: |
        Endpoint para recuperação de informações sobre o Webhook.
      security:
        - OAuth2: [webhookrec.read]
      responses:
        "200":
          description: "Dados do webhook."
          content:
            "application/json":
              schema:
                $ref: "../schemas/WebhookRecCompleto.yaml"
              examples:
                response1:
                  $ref: "../examples/recWebhookResponse1.yaml"
        "403":
          $ref: "../../03 - Tratamento de erros/responses/AcessoNegado.yaml"
        "404":
          $ref: "../../03 - Tratamento de erros/responses/NaoEncontrado.yaml"
        "503":
          $ref: "../../03 - Tratamento de erros/responses/ServicoIndisponivel.yaml"
    delete:
      tags:
        - WebhookRec
      summary: "Cancelar o Webhook."
      description: |
        Endpoint para cancelamento do webhook. Não é a única forma pela qual um webhook pode ser
        removido.
      security:
        - OAuth2: [webhookrec.write]
      responses:
        "204":
          description: "Webhook para notificações foi cancelado."
        "403":
          $ref: "../../03 - Tratamento de erros/responses/AcessoNegado.yaml"
        "404":
          $ref: "../../03 - Tratamento de erros/responses/NaoEncontrado.yaml"
        "503":
          $ref: "../../03 - Tratamento de erros/responses/ServicoIndisponivel.yaml"
