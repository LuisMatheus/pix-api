      title: "Cobrança imediata completa"
      required: ["status"]
      allOf:
        - $ref: "CobGerada.yaml"
        - type: "object"
          properties:
            status:
              $ref: "CobStatus.yaml"
        - type: "object"
          properties:
            tributo:
              allOf:
                - $ref: "../tributos/TributoCompleto.yaml"
        - $ref: "../tributos/ValorLiquidoEstimado.yaml"
        - type: "object"
          properties:
            pix:
              type: "array"
              title: "Pix recebidos"
              items:
                allOf:
                  - $ref: "../pix/PixConsultado.yaml"
                  - type: "object"
                    properties:
                      txid:
                        allOf:
                          - $ref: "../comuns/TxId.yaml"
                          - pattern: "[a-zA-Z0-9]{26,35}"
