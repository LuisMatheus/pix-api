      type: "object"
      title: "Histórico de Tentativas da Cobrança Recorrente"
      properties:
        tentativas:
          type: "array"
          title: "Histórico de Tentativas de Cobrança"
          description: "Histórico de Tentativas de Cobrança"
          items:
            type: "object"
            required: ["dataLiquidacao", "tipo", "endToEndId", "status","atualizacao"]
            properties:
              dataLiquidacao:
                type: "string"
                format: "date"
                description: "Data prevista para liquidação da cobrança. Trata-se de uma data, no formato `YYYY-MM-DD`, segundo ISO 8601."
                example: "2023-04-01"
              tipo:
                type: "string"
                title: "Tipo da Tentativa"
                description: "Tipo da tentativa da cobrança."
                enum:
                  - "AGND"
                  - "NTAG"
                  - "RIFL"
              status:
                type: "string"
                title: "Status da Tentativa"
                description: "Status da tentativa da cobrança."
                enum:
                  - "SOLICITADA"
                  - "AGENDADA"
                  - "PAGA"
                  - "CANCELADA"
                  - "REJEITADA"
                  - "EXPIRADA"
              endToEndId:
                $ref: "../pix/EndToEndId.yaml"
              atualizacao:
                type: "array"
                title: "Histórico de Status da Tentativa"
                description: "Histórico das mudanças de status da tentativa de cobrança."
                items:
                  type: "object"
                  required: ["status", "data"]
                  properties:
                    status:
                      type: "string"
                      title: "Status da Tentativa"
                      description: "Status da tentativa da cobrança."
                      enum:
                        - "SOLICITADA"
                        - "AGENDADA"
                        - "PAGA"
                        - "CANCELADA"
                        - "REJEITADA"
                        - "EXPIRADA"
                    data:
                      type: "string"
                      format: "date-time"
                      description: "Data e hora do registro de status atualizado. Respeita RFC 3339."
              rejeicao:
                type: "object"
                title: "Informações sobre a rejeição da tentativa da cobrança"
                required: ["codigo", "descricao"]
                description: "Informações sobre a rejeição da tentativa da cobrança"
                properties:
                  codigo:
                    type: "string"
                    title: "Código da rejeição da tentativa"
                    description: |
                      Código da rejeição da tentativa. Corresponde ao código de rejeição presente no catálogo de mensagens. 
                      
                      Os códigos de rejeição da tentativa `AC05`,`AM09`,`CRNC`, `DENC`,`DTED`, `FCD2`, `GRER`, `MIDI`, `MSUC`, `NITX` e `UDEI` causam a rejeição da cobrança recorrente correspondente.

                      Os códigos de rejeição da tentativa `DS27`, `FBRD` e `RC09` estão em desuso.
                    maxLength: 4
                    enum:
                      - AB10
                      - AC05
                      - AC06
                      - AM02
                      - AM09
                      - CRNC
                      - DENC
                      - DS27
                      - DTED
                      - DTNT
                      - FBRD
                      - FCD1
                      - FCD2
                      - GRER
                      - IRNT
                      - MIDI
                      - MSUC
                      - NIEC
                      - NIPA
                      - NITX
                      - QUNT
                      - RC09
                      - UDEI
                  descricao:
                    type: "string"
                    title: "Descricao da rejeição"
                    description: "Descricao da causa da rejeição"
                    maxLength: 400          
