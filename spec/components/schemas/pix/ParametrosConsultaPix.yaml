      type: "object"
      title: "Parâmetros de Consulta Pix"
      description: "Parâmetros utilizados para a realização de uma consulta de Pix."
      required: ["inicio", "fim", "paginacao"]
      properties:
        inicio:
          type: "string"
          format: "date-time"
          title: "Data de Início"
          description: "Data inicial utilizada na consulta. Respeita RFC 3339."
          example: "2020-01-01T00:00:00Z"
        fim:
          type: "string"
          format: "date-time"
          title: "Data de Fim"
          description: "Data de fim utilizada na consulta. Respeita RFC 3339."
          example: "2020-12-01T17:00:00Z"
        txid:
          allOf:
            - $ref: "../comuns/TxId.yaml"
            - pattern: "[a-zA-Z0-9]{1,35}"
        txIdPresente:
          type: "boolean"
          description: "Filtro pela existência de txid."
        devolucaoPresente:
          type: "boolean"
          description: "Filtro pela existência do array de devoluções."
        finalidadeMED:
          type: "boolean"
          description: "Filtro pela finalidade MED. Quando preenchido com `true` apenas os Pix (PACS008) cuja finalidade seja uma devolução no âmbito do MED serão retornados. Quando preenchido com `false` todos os Pix que não forem MED serão retornados. Na ausência deste filtro, qualquer Pix que atenda aos demais parâmetros de pesquisa será retornado na resposta."
        cpf:
          type: "string"
          pattern: "/^\\d{11}$/"
          description: "CPF"
        cnpj:
          type: "string"
          pattern: "^[0-9A-Z]{14}$"
          description: "CNPJ"
        paginacao:
          $ref: "../comuns/Paginacao.yaml"
