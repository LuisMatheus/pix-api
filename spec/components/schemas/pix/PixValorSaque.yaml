      type: "object"
      properties:
        saque:
          type: "object"
          required: ["valor", "modalidadeAgente", "prestadorDoServicoDeSaque"]
          properties:
            valor:
              type: "string"
              title: "Valor do Saque Pix"
              description: "Valor do Saque Pix."
              pattern: "\\d{1,10}\\.\\d{2}"
            modalidadeAgente:
              type: "string"
              title: "Modalidade do Agente"
              description: |
                ##### Modalidade do Agente
                <table><tr><th>SIGLA</th><th>Descrição</th></tr><tr><td>AGTEC</td><td>Agente Estabelecimento Comercial</td></tr><tr><td>AGTOT</td><td>Agente Outra Espécie de Pessoa Jurídica ou Correspondente no País</td></tr><tr><td>AGPSS</td><td>Em desuso. Utilizar <b>AGFSS</b>.</td></tr><tr><td>AGFSS</td><td>Agente Facilitador de Serviço de Saque</td></tr></table>
              enum:
                - "AGTEC"
                - "AGTOT"
                - "AGPSS"
                - "AGFSS"
            prestadorDoServicoDeSaque:
              type: "string"
              title: "Facilitador de Serviço de Saque"
              pattern: "^[0-9A-Z]{8}$"
              description: "ISPB do Facilitador de Serviço de Saque"
