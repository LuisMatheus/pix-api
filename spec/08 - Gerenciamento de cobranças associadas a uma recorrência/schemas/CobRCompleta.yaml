      type: "object"
      title: "Cobrança Recorrente Completa"
      required:
        ["idRec","txid", "status", "valor", "recebedor", "calendario"]
      description: "Dados completos da cobrança recorrente via API Pix"
      allOf:
        - type: "object"
          properties:
            idRec:
              $ref: "../../06 - Gerenciamento de recorrências/schemas/RecId.yaml"
        - type: "object"
          properties:
            txid:
              $ref: "../../compartilhado/schemas/comuns/TxId.yaml"
        - $ref: "CobRBase.yaml"
        - type: "object"
          properties:
            calendario:
              type: "object"
              required: ["criacao"]
              properties:
                criacao:
                  type: "string"
                  format: "date"
                  title: "Data de criação da cobrança"
                  description: "Trata-se de uma data, no formato `YYYY-MM-DD`, segundo ISO 8601. É a data de criação da cobrança."
                  example: "2023-04-01"
        - $ref: "CobRStatus.yaml"
        - $ref: "CobRConfiguracao.yaml"
        - $ref: "DadosDevedorRecorrencia.yaml"
        - type: "object"
          properties:
            pix:
              type: "array"
              title: "Pix recebidos"
              items:
                allOf:
                  - $ref: "PixAutomaticoConsultado.yaml"
        - $ref: "CobRAtualizacao.yaml"
        - $ref: "CobRTentativas.yaml"
        - type: "object"
          properties:
            tributo:
              $ref: "../../compartilhado/schemas/tributos/TributoCompleto.yaml"
        - $ref: "../../compartilhado/schemas/tributos/ValorLiquidoEstimado.yaml"
