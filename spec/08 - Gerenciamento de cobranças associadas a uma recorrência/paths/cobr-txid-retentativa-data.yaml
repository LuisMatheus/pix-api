    parameters:
      - name: txid
        in: path
        required: true
        schema:
          $ref: "../../compartilhado/schemas/comuns/TxId.yaml"
      - name: data
        in: path
        required: true
        description: "Data prevista para liquidação da ordem de pagamento correspondente. Trata-se de uma data, no formato `YYYY-MM-DD`, segundo ISO 8601."
        schema:
          type: "string"
          format: "date"
          example: "2023-04-01"
    post:
      tags:
        - "CobR"
      summary: "Solicitar retentativa de cobrança."
      security:
        - OAuth2: [cobr.write]
      description: |-
        Endpoint para solicitar retentativa de uma cobrança recorrente.
      responses:
        "201":
          description: "Cobrança recorrente."
          content:
            "application/json":
              schema:
                allOf:
                  - required: ["tentativas"]
                  - $ref: "../schemas/CobRCompleta.yaml"
              examples:
                response1:
                  $ref: "../examples/cobRResponse3.yaml"
        "400":
          description: "Requisição com formato inválido."
          content:
            application/problem+json:
              schema:
                $ref: "../../03 - Tratamento de erros/schemas/Problema.yaml"
              examples:
                exemplo1:
                  $ref: "../examples/erros/RequisicaoInvalidaCobRTentativaExample1.yaml"
        "403":
          $ref: "../../03 - Tratamento de erros/responses/AcessoNegado.yaml"
        "404":
          $ref: "../../03 - Tratamento de erros/responses/NaoEncontrado.yaml"
        "503":
          $ref: "../../03 - Tratamento de erros/responses/ServicoIndisponivel.yaml"
