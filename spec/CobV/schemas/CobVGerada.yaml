      type: "object"
      title: "Cobrança com Vencimento Gerada"
      description: "Dados criados ou alterados da cobrança com vencimento via API Pix"
      required:
        [
          "location",
          "txid",
          "devedor",
          "calendario",
          "revisao",
          "status",
          "valor",
          "chave",
          "recebedor",
        ]
      allOf:
        - type: "object"
          properties:
            calendario:
              required: ["validadeAposVencimento"]
              title: "Calendário"
              description: "Os campos aninhados sob o identificador calendário organizam informações a respeito de controle de tempo da cobrança."
              allOf:
                - $ref: "../../compartilhado/schemas/cobrancas/CobCriacao.yaml"
                - $ref: "CobDataDeVencimento.yaml"
            txid:
              $ref: "../../compartilhado/schemas/comuns/TxId.yaml"
            revisao:
              $ref: "../../compartilhado/schemas/comuns/Revisao.yaml"
        - $ref: "../../compartilhado/schemas/comuns/DadosDevedor.yaml"
        - $ref: "../../compartilhado/schemas/comuns/DadosRecebedor.yaml"
        - type: "object"
          properties:
            loc:
              required: ["id", "txid", "tipoCob", "criacao"]
              allOf:
                - $ref: "../../PayloadLocation/schemas/PayloadLocation.yaml"
        - type: "object"
          properties:
            status:
              $ref: "CobVStatus.yaml"
        - type: "object"
          properties:
            valor:
              required: ["original"]
              allOf:
                - $ref: "CobVValor.yaml"
        - $ref: "../../compartilhado/schemas/cobrancas/CobBaseCopiaCola.yaml"
        - type: "object"
          properties:
            tributo:
              allOf:
                - $ref: "../../compartilhado/schemas/tributos/TributoInformadoCompleto.yaml"
        - $ref: "../../compartilhado/schemas/tributos/ValorLiquidoEstimado.yaml"
