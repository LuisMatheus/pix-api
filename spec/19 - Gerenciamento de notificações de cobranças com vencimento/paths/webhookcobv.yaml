    put:
      tags:
        - WebhookCobV
      summary: Configurar Webhook.
      description: |
        Endpoint para configuração do serviço de notificações acerca de cobranças recorrentes. Somente cobranças recorrentes associadas ao usuário recebedor serão notificadas.
      security:
        - OAuth2: [webhookcobV.write]
      requestBody:
        $ref: "../requestBodies/WebhookCobVConfigBody.yaml"
      responses:
        "200":
          description: Webhook para notificações.
        "400":
          description: "Requisição com formato inválido."
          content:
            application/problem+json:
              schema:
                $ref: "../../03 - Tratamento de erros/schemas/Problema.yaml"
        "403":
          $ref: "../../03 - Tratamento de erros/responses/AcessoNegado.yaml"
        "404":
          $ref: "../../03 - Tratamento de erros/responses/NaoEncontrado.yaml"
        "503":
          $ref: "../../03 - Tratamento de erros/responses/ServicoIndisponivel.yaml"
      callbacks:
        cobr:
          "{$request.body#/webhookUrl}/cobv":
            post:
              description: ""
              security: []
              requestBody:
                $ref: "../requestBodies/WebhookCobVBody.yaml"
              responses:
                "200":
                  description: "Notificação recebida com sucesso"
    get:
      tags:
        - WebhookCobV
      summary: "Exibir informações acerca do Webhook."
      description: |
        Endpoint para recuperação de informações sobre o Webhook.
      security:
        - OAuth2: [webhookcobv.read]
      responses:
        "200":
          description: "Dados do webhook."
          content:
            "application/json":
              schema:
                $ref: "../schemas/WebhookCobVCompleto.yaml"
        "403":
          $ref: "../../03 - Tratamento de erros/responses/AcessoNegado.yaml"
        "404":
          $ref: "../../03 - Tratamento de erros/responses/NaoEncontrado.yaml"
        "503":
          $ref: "../../03 - Tratamento de erros/responses/ServicoIndisponivel.yaml"
    delete:
      tags:
        - WebhookCobV
      summary: "Cancelar o Webhook."
      description: |
        Endpoint para cancelamento do webhook. Não é a única forma pela qual um webhook pode ser
        removido.
      security:
        - OAuth2: [webhookcobv.write]
      responses:
        "204":
          description: "Webhook para notificações foi cancelado."
        "403":
          $ref: "../../03 - Tratamento de erros/responses/AcessoNegado.yaml"
        "404":
          $ref: "../../03 - Tratamento de erros/responses/NaoEncontrado.yaml"
        "503":
          $ref: "../../03 - Tratamento de erros/responses/ServicoIndisponivel.yaml"
