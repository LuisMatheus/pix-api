extends:
  - spec

rules:
  security-scopes-defined: error
  no-invalid-parameter-examples: error
  # Desativadas temporariamente para ignorar as inconsistências conhecidas.
  no-identical-paths: off
  no-required-schema-properties-undefined: off
  no-undefined-server-variable: off
  no-invalid-schema-examples: off
  no-invalid-media-type-examples:
    severity: off
    allowAdditionalProperties: true

plugins:
  - ./scripts/descricao-redoc.mjs

apis:
  pix:
    root: ./spec/openapi.yaml
    decorators:
      descricao-redoc/compor-secoes:
        arquivos:
          - spec/01 - API Pix/descricao.md
          - spec/02 - Evolução da API Pix/descricao.md
          - spec/03 - Tratamento de erros/descricao.md
