name: Publicar release do fork

on:
  push:
    tags: ['fork-v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Preparar e publicar release
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
      - name: Validar versão do fork
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release-changelog.mjs validate
      - name: Instalar dependências
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Gerar contrato da tag
        run: |
          npm run bundle
          git diff --exit-code -- openapi.yaml
      - name: Gerar documentação Redoc
        run: npm run build:docs
      - name: Gerar changelog do contrato em português
        id: changelog
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/oasdiff/oasdiff/releases/download/v1.39.0/oasdiff_1.39.0_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/oasdiff.tar.gz"
          printf '%s  %s\n' \
            '71a85930728f367a2086077b7ae1411319421549d18473a3e8258b6451520433' \
            "$RUNNER_TEMP/oasdiff.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/oasdiff.tar.gz" -C "$RUNNER_TEMP" oasdiff
          node scripts/release-changelog.mjs prepare "$RUNNER_TEMP/oasdiff"
          cp scripts/release-changelog.mjs "$RUNNER_TEMP/release-changelog.mjs"
      - name: Preparar arquivos da release
        run: |
          mkdir -p reports/release
          cp openapi.yaml reports/release/spec.yaml
          npm exec -- redocly bundle pix --output reports/release/spec.json
          cp site/index.html reports/release/spec.html
          cd reports/release
          sha256sum spec.yaml spec.json spec.html changelog.md > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Disponibilizar pacote da release
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.version.outputs.tag }}
          path: reports/release/
          if-no-files-found: error
      - name: Publicar release no GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          IS_PRERELEASE: ${{ steps.version.outputs.prerelease }}
          PREVIOUS_TAG: ${{ steps.changelog.outputs.previous_tag }}
        run: |
          state=$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' 2>/dev/null || true)
          if [ "$state" = 'false' ]; then
            echo "A release $RELEASE_TAG já foi publicada; seu conteúdo será preservado."
            exit 0
          fi
          if [ "$state" != 'true' ]; then
            options=()
            if [ -n "$PREVIOUS_TAG" ]; then
              options+=(--notes-start-tag "$PREVIOUS_TAG")
            fi
            gh release create "$RELEASE_TAG" --draft --verify-tag \
              --title "$RELEASE_TAG" --generate-notes "${options[@]}" \
              --notes-file reports/release-notes.md
          fi
          gh release upload "$RELEASE_TAG" \
            reports/release/spec.yaml reports/release/spec.json reports/release/spec.html \
            reports/release/changelog.md reports/release/SHA256SUMS \
            --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease="$IS_PRERELEASE"
      - name: Registrar changelog na master
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch --no-tags origin master
            git switch --detach origin/master
            node "$RUNNER_TEMP/release-changelog.mjs" update
            if git diff --quiet -- changelog.md; then
              echo "O changelog de $RELEASE_TAG já está registrado."
              exit 0
            fi
            git add -- changelog.md
            git commit --only -m "docs: registrar changelog de $RELEASE_TAG" -- changelog.md
            if git push origin HEAD:refs/heads/master; then
              exit 0
            fi
          done
          echo 'Não foi possível atualizar o changelog na master. Execute o workflow novamente.' >&2
          exit 1
