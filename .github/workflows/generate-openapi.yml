name: Gerar OpenAPI

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      run_lint:
        description: Executar lint do contrato com Redocly
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: generate-openapi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    name: Gerar contrato
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
      - name: Instalar dependências
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Gerar openapi.yaml
        run: npm run bundle
      - name: Validar regras ativas do contrato
        if: ${{ inputs.run_lint }}
        run: npm run lint
      - name: Disponibilizar openapi.yaml
        uses: actions/upload-artifact@v4
        with:
          name: openapi-contract
          path: openapi.yaml
          if-no-files-found: error
      - name: Atualizar openapi.yaml na master
        if: github.ref == 'refs/heads/master'
        shell: sh
        run: |
          set -eu

          git add -- openapi.yaml
          if git diff --cached --quiet -- openapi.yaml; then
              echo 'openapi.yaml já está atualizado. Nenhum commit necessário.'
              exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --only -m 'chore: regenerate openapi.yaml' -- openapi.yaml
          git push origin HEAD:refs/heads/master
